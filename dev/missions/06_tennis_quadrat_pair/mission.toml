name        = "06_tennis_quadrat_pair"
description = "Two-waypoint tennis court survey with 4-bearing rotating quadrat at each. End-to-end botanical-style ground-truth run: 8 geotagged frames + sidecars."
mode        = "nav"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host       = "caster.emlid.com"
port       = 2101
mountpoint = "MP15774"
username   = "u26787"
password   = "492utz"

[robot]
connection_mode = "LocalSTA"

[navigation]
arrival_tolerance = 0.5
max_velocity      = 0.5
rotation_rate     = 0.8
min_fix_type      = 4
max_hacc          = 0.10
gps_fix_timeout   = 300

[capture]
strategy           = "rotating_quadrat"
settle_time        = 2.0
gps_avg_sec        = 3.0
bearings           = [0.0, 90.0, 180.0, 270.0]
output_subdir      = "captures"
turn_tolerance_deg = 5.0
turn_timeout_sec   = 20.0
