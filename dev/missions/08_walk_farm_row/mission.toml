name        = "08_walk_farm_row"
description = "Lawnmower line survey of the farm: 2 parallel rows (~15 m legs) walked corner-to-corner at 0.5 m/s, capturing a clean frame every 2 m of along-track travel. Waypoints are the real field-measured row corners (4 leg endpoints)."
mode        = "nav"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host        = "caster.emlid.com"
port        = 2101
mountpoints = ["MP22385", "MP22385a"]
usernames   = ["u26787",  "u26787"]
passwords   = ["492utz",  "492utz"]

[robot]
connection_mode = "LocalSTA"

[navigation]
arrival_tolerance = 0.25
max_velocity      = 0.5
rotation_rate     = 0.8
min_fix_type      = 4
max_hacc          = 0.10
gps_fix_timeout   = 300

[capture]
# Line survey: drive straight legs between the corner waypoints at
# [navigation] max_velocity, turning in place at each corner, and capture a
# clean frame every capture_interval_m of along-track travel. Capture points
# are not waypoints — each image is geotagged with its own interpolated RTK
# position.
strategy           = "line_survey"
capture_interval_m = 2.0
output_subdir      = "captures"
