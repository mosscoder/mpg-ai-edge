# mission.toml — template. To create a new mission, copy this directory:
#
#     cp -r dev/missions/_template dev/missions/mission_NAME
#
# then edit `name` / `description` below and replace waypoints.geojson with
# your actual FeatureCollection of Point features.

name        = "TEMPLATE"
description = "Replace with a one-line description of what this mission does"
# mode defaults to "nav". Other supported modes include "cooling_test",
# "static_camera", "static_geotag", "probe_gps", and "probe_lidar".

# Run outputs (logs, captures, sidecars) default to <mission>/runs/ inside
# the repo. Set output_dir to keep field data out of the repo — runs then
# land at <output_dir>/<mission_name>/<run_name>/. `~` and $ENV_VARS are
# expanded; a relative path resolves against the mission dir.
# output_dir = "~/go2-survey-data"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host        = "caster.emlid.com"
port        = 2101
# Parallel lists: index 0 is primary, subsequent indices are tried in
# order on failure (3 attempts per endpoint before moving on). All
# three lists must have the same length.
mountpoints = ["MP22385", "MP22385a"]
usernames   = ["u26787",  "u26787"]
passwords   = ["492utz",  "492utz"]
# What to do when every endpoint exhausts its retry budget:
#   "warn_continue" (default) — proceed in GNSS-only mode with a
#       tightened quality gate (Float treated as suspect)
#   "abort"                   — refuse to start the mission. Use for
#       production survey runs that require RTK precision.
# on_unavailable = "abort"

[robot]
connection_mode = "LocalSTA"
# ip     = "192.168.1.105"    # optional; if omitted, discovery is attempted
# serial = "..."              # optional; alternative to ip

[navigation]
arrival_tolerance       = 0.25   # meters — stop when within this distance of a waypoint
max_velocity            = 0.5    # m/s   — forward speed cap
rotation_rate           = 0.8    # rad/s — rotation speed during turns
min_fix_type            = 4      # 4=GNSS+DR, 5=RTK Float, 6=RTK Fixed
max_hacc                = 0.10   # meters — pause nav if hAcc degrades above this
gps_fix_timeout         = 300    # seconds — max wait for INITIAL fix
mid_mission_fix_timeout = 60     # seconds — max pause once underway before aborting the leg
max_rtcm_age_s          = 5.0    # seconds — beyond this, RTK readings are treated as "coasting"
stabilization_period_s     = 60   # seconds — robot stationary after initial fix, lets RTK soak to Fixed (0 disables)
stabilization_early_exit_s = 3.0  # seconds — if RTK Fixed + active corrections held this long, exit dwell early (0 disables)

# [cooling] block is optional. By default, navigation pauses as soon as the
# hottest thigh/shoulder motor reaches 70 C, crouches the robot, and resumes
# only after all four thigh motors are at or below 55 C. Uncomment to retune
# or set enabled=false to disable.
# [cooling]
# enabled             = true
# trigger_temp_c      = 70
# resume_temp_c       = 55
# poll_interval_s     = 5.0
# log_interval_s      = 30.0
# telemetry_max_age_s = 15.0
# lock_wait_s         = 1.0
# crouch_wait_s       = 3.0
# stand_wait_s        = 2.0

# [capture] block is optional — uncomment + set strategy to enable.
# Captures land under <run_dir>/<output_subdir>/, co-located with
# main.log / imu.log / gps.log for that run.
# [capture]
# strategy             = "line_survey"   # "none" | "frame_only" | "waypoint_forward" | "line_survey"
# capture_interval_m   = 2.0          # line_survey: capture every N m of along-track travel
# leg_steering         = "cross_track"  # "point_seek" | "cross_track" — cross_track is the validated steering
# lookahead_m          = 4.0          # cross_track carrot distance on the leg line (m)
# course_lookback_m    = 1.0          # cross_track GPS-course baseline (m)
# turn_tolerance_deg   = 2.0          # corner-turn alignment tolerance before a leg drive
# settle_time          = 2.0          # seconds after stop, before sampling (waypoint strategies)
# gps_avg_sec          = 3.0          # GPS averaging window at capture (0 disables)
# output_subdir        = "captures"   # subdir under run_dir where captures land
