name        = "02_probe_sparkfun_data"
description = "F9R diagnostic probe: heading behavior, precision, sensor fusion, firmware, correction age. No robot, no nav."
mode        = "probe_gps"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host       = "caster.emlid.com"
port       = 2101
mountpoint = "MP15774"
username   = "u65352"
password   = "338zca"

[navigation]
# Only used for gps_fix_timeout + min_fix_type during the initial wait.
# All other nav settings are ignored in probe_gps mode.
min_fix_type    = 4       # GNSS+DR — probe useful even without RTK, we log whatever we get
gps_fix_timeout = 180

[probe]
duration_sec    = 120.0   # total sampling window
sample_rate_hz  = 5.0     # NAV-PVT / NAV-HPPOSLLH / NAV-DOP rate
wait_for_fix    = true    # block until initial fix before sampling, so Phase 2 data is RTK-quality
