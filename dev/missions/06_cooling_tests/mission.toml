name        = "06_cooling_tests"
description = "Two-waypoint tennis-court thermal interlock test. Alternates between the archived 06_tennis_quadrat_pair waypoints, performs cardinal turns without capture, pauses to crouched cooldown at 70 C, resumes under 55 C, then finishes with an indefinite cooldown hold."
mode        = "cooling_test"

[gps]
port = "/dev/ttyACM0"
baud = 38400

[ntrip]
host        = "caster.emlid.com"
port        = 2101
mountpoints = ["MP22385", "MP22385a"]
usernames   = ["u26787",  "u26787"]
passwords   = ["492utz",  "492utz"]

[robot]
connection_mode = "LocalSTA"

[navigation]
arrival_tolerance = 0.25
max_velocity      = 0.5
rotation_rate     = 0.8
min_fix_type      = 4
max_hacc          = 0.10
gps_fix_timeout   = 300
# Align the health banner's STOP threshold with the cooling interlock.
motor_caution_temp_c = 65
motor_danger_temp_c  = 70

[cooling]
enabled             = true
trigger_temp_c      = 70
resume_temp_c       = 55
poll_interval_s     = 5.0
log_interval_s      = 30.0
telemetry_max_age_s = 15.0
lock_wait_s         = 1.0
crouch_wait_s       = 3.0
stand_wait_s        = 2.0

[capture]
strategy           = "none"
settle_time        = 2.0
turn_tolerance_deg = 2.0
